name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional

      - name: Lint
        run: npm run lint

      - name: Compile contracts
        run: npm run compile

      - name: Typecheck
        run: npm run typecheck

      - name: Test contracts and application
        run: npm test

      - name: Build static app
        env:
          GITHUB_PAGES: true
          REPO_NAME: celoht-dapp
          NEXT_PUBLIC_BASE_PATH: /celoht-dapp
          NEXT_PUBLIC_APP_URL: https://celo-haiti.github.io/celoht-dapp/
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: 02d9a7daa098b201a99a7da3769392b2
          NEXT_PUBLIC_DONATION_RECIPIENT_ADDRESS: 0x7c5730e7fcf3adfbdf1c203e1f2491629310cead
          NEXT_PUBLIC_USDM_MAINNET_ADDRESS: "0x765DE816845861e75A25fCA122bb6898b8b1282a"
          NEXT_PUBLIC_USDM_SEPOLIA_ADDRESS: "0xdE9e4C3ce781b4bA68120d6261cbad65ce0aB00b"
        run: npm run build

      - name: Add .nojekyll
        run: |
          test -f out/index.html
          test -f out/wallet/index.html
          test -f out/celoht-logo.png
          test -f out/favicon.svg
          test -f out/favicon.ico
          test -f out/manifest.json
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
